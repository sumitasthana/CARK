<svg id="architecture-picture" data-mode="unlearning" data-highlight="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Learning and unlearning in the hypernetwork</title>
  <desc id="architecture-description">Learning updates the shared generator and a new task code using classification error plus protection. Unlearning updates only the shared generator using gamma times distance from actual generated weights to noise, plus protection. Task codes and chunk codes are frozen during unlearning.</desc>
  <defs><marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526074"/></marker></defs>
  <style>
    #architecture-picture text{font-family:system-ui,sans-serif;fill:#253349;font-size:17px}
    #architecture-picture .architecture-label{font-size:20px;font-weight:700}
    #architecture-picture .architecture-small{font-size:14px}
    #architecture-picture .architecture-status{font-size:13px;font-weight:700}
    #architecture-picture .architecture-box{fill:#f2f6fa;stroke:#91adc8;stroke-width:1.5}
    #architecture-picture .architecture-flow{fill:none;stroke:#526074;stroke-width:2;marker-end:url(#architecture-arrow)}
    #architecture-picture .architecture-frozen{fill:#edf0f3;stroke:#a3afb9}
    #architecture-picture .architecture-weights{fill:#fff1dd;stroke:#b86222;stroke-width:2.5}
    #architecture-picture[data-mode="learning"] .architecture-unlearning{display:none}
    #architecture-picture[data-mode="unlearning"] .architecture-learning{display:none}
    #architecture-picture[data-highlight="true"] .architecture-updated{fill:#e3f4ec;stroke:#267768;stroke-width:2}
    #architecture-picture[data-mode="learning"][data-highlight="true"] .architecture-task-box{fill:#e3f4ec;stroke:#267768;stroke-width:2}
    #architecture-picture[data-mode="unlearning"] .architecture-task-box{fill:#edf0f3;stroke:#a3afb9}
    #architecture-picture .architecture-node{cursor:pointer}
    #architecture-picture .architecture-node:focus{outline:none}
    #architecture-picture .architecture-node:focus>rect,#architecture-picture .architecture-node.architecture-selected>rect{stroke:#245d99;stroke-width:4}
  </style>
  <rect x="1" y="1" width="958" height="1078" rx="7" fill="white"/>
  <text x="24" y="30" class="architecture-label architecture-learning">Learning: add task 15 to the saved model</text>
  <text x="24" y="30" class="architecture-label architecture-unlearning">Unlearning: suppress task 3 while protecting seven other tasks</text>
  <g class="architecture-node" data-component="codes" role="button" tabindex="0" aria-label="Explain task codes and chunk codes">
    <rect class="architecture-box architecture-task-box" x="24" y="56" width="236" height="92" rx="6"/>
    <text x="142" y="86" text-anchor="middle">Task code: 32 numbers</text>
    <text x="142" y="112" text-anchor="middle" class="architecture-small architecture-learning">New task 15</text>
    <text x="142" y="112" text-anchor="middle" class="architecture-small architecture-unlearning">Existing task 3</text>
    <text x="142" y="134" text-anchor="middle" class="architecture-status architecture-learning">UPDATED during learning</text>
    <text x="142" y="134" text-anchor="middle" class="architecture-status architecture-unlearning">FROZEN during unlearning</text>
    <rect class="architecture-box architecture-frozen" x="24" y="164" width="236" height="80" rx="6"/>
    <text x="142" y="194" text-anchor="middle">Chunk code: 32 numbers</text>
    <text x="142" y="224" text-anchor="middle" class="architecture-status">FROZEN in these continuations</text>
  </g>
  <path class="architecture-flow" d="M260 102 H282 V153 H307"/><path class="architecture-flow" d="M260 204 H282 V153 H307"/>
  <rect class="architecture-box" x="312" y="113" width="192" height="80" rx="6"/>
  <text x="408" y="146" text-anchor="middle">Join both codes</text><text x="408" y="176" text-anchor="middle">64-number input</text>
  <path class="architecture-flow" d="M504 153 H551"/>
  <g class="architecture-node" data-component="generator" role="button" tabindex="0" aria-label="Explain the shared generator and output heads">
    <rect class="architecture-box architecture-updated" x="556" y="88" width="374" height="130" rx="6"/>
    <text x="743" y="119" text-anchor="middle" class="architecture-label">Shared hypernetwork layers</text>
    <text x="743" y="151" text-anchor="middle">128 → 256 → 512 units</text>
    <text x="743" y="178" text-anchor="middle" class="architecture-small">Fully connected; ReLU after each layer</text>
    <text x="743" y="204" text-anchor="middle" class="architecture-status">UPDATED in both operations</text>
    <path class="architecture-flow" d="M743 218 V270 H174 V295"/><path class="architecture-flow" d="M743 218 V270 H478 V295"/><path class="architecture-flow" d="M743 218 V270 H782 V295"/>
    <rect class="architecture-box architecture-updated" x="24" y="300" width="300" height="92" rx="6"/>
    <text x="174" y="330" text-anchor="middle">Ordinary weight head</text><text x="174" y="358" text-anchor="middle" class="architecture-small">174 chunks</text><text x="174" y="380" text-anchor="middle" class="architecture-status">UPDATED</text>
    <rect class="architecture-box architecture-updated" x="336" y="300" width="284" height="92" rx="6"/>
    <text x="478" y="330" text-anchor="middle">BatchNorm parameter head</text><text x="478" y="358" text-anchor="middle" class="architecture-small">2 chunks</text><text x="478" y="380" text-anchor="middle" class="architecture-status">UPDATED</text>
    <rect class="architecture-box architecture-updated" x="632" y="300" width="300" height="92" rx="6"/>
    <text x="782" y="330" text-anchor="middle">Residual projection head</text><text x="782" y="358" text-anchor="middle" class="architecture-small">24 chunks</text><text x="782" y="380" text-anchor="middle" class="architecture-status">UPDATED</text>
  </g>
  <path class="architecture-flow" d="M174 392 V418 H478 V443"/><path class="architecture-flow" d="M478 392 V443"/><path class="architecture-flow" d="M782 392 V418 H478 V443"/>
  <g class="architecture-node" data-component="weights" role="button" tabindex="0" aria-label="Explain actual classifier weights after assembly and scaling">
    <rect class="architecture-box architecture-weights" x="132" y="448" width="696" height="94" rx="6"/>
    <text x="480" y="478" text-anchor="middle" class="architecture-label">Actual classifier weights: 23,520,842 parameters</text>
    <text x="480" y="509" text-anchor="middle">Assemble 200 chunks; reshape, scale, and add offsets</text>
    <text x="480" y="531" text-anchor="middle" class="architecture-small">Noise distance and protection compare these final values.</text>
  </g>
  <g class="architecture-learning">
    <path class="architecture-flow" d="M480 542 V605"/><text x="498" y="573" class="architecture-small">Generated weights</text>
    <rect class="architecture-box" x="24" y="610" width="222" height="100" rx="6"/>
    <text x="135" y="644" text-anchor="middle">Task-15 images</text><text x="135" y="675" text-anchor="middle" class="architecture-small">64 × 64 RGB; pixels in [0, 1]</text>
    <path class="architecture-flow" d="M246 660 H319"/>
    <rect class="architecture-box" x="324" y="610" width="312" height="100" rx="6"/>
    <text x="480" y="644" text-anchor="middle" class="architecture-label">Modified ResNet50</text><text x="480" y="675" text-anchor="middle" class="architecture-small">New-task running statistics update</text>
    <path class="architecture-flow" d="M636 660 H711"/>
    <rect class="architecture-box" x="716" y="610" width="216" height="100" rx="6"/>
    <text x="824" y="644" text-anchor="middle">Ten class scores</text><text x="824" y="675" text-anchor="middle" class="architecture-small">Compare with correct labels</text>
    <path class="architecture-flow" d="M824 710 V749 H641"/>
  </g>
  <g class="architecture-unlearning">
    <path class="architecture-flow" d="M480 542 V570 H626 V605"/><text x="639" y="582" class="architecture-small">Final weights, not raw head output</text>
    <rect class="architecture-box" x="24" y="610" width="282" height="100" rx="6"/>
    <text x="165" y="640" text-anchor="middle">Fresh Gaussian noise</text><text x="165" y="668" text-anchor="middle" class="architecture-small">Mean 0; variance 1</text><text x="165" y="694" text-anchor="middle" class="architecture-small">Ten vectors per update</text>
    <path class="architecture-flow" d="M306 660 H355"/>
    <rect class="architecture-box" x="360" y="610" width="572" height="100" rx="6"/>
    <text x="646" y="642" text-anchor="middle" class="architecture-label">Squared distance: task-3 weights to noise</text><text x="646" y="673" text-anchor="middle" class="architecture-small">No training images or class predictions needed</text><text x="646" y="696" text-anchor="middle" class="architecture-small">All BatchNorm running statistics stay frozen</text>
    <path class="architecture-flow" d="M646 710 V749 H641"/>
  </g>
  <g class="architecture-node" data-component="objective" role="button" tabindex="0" aria-label="Explain the selected training objective">
    <rect class="architecture-box" x="324" y="727" width="312" height="74" rx="6"/>
    <text x="480" y="758" text-anchor="middle" class="architecture-learning">Classification error</text><text x="480" y="785" text-anchor="middle" class="architecture-small architecture-learning">Cross-entropy loss</text>
    <text x="480" y="758" text-anchor="middle" class="architecture-unlearning">0.01 × noise distance</text><text x="480" y="785" text-anchor="middle" class="architecture-small architecture-unlearning">Gamma weights the noise term</text>
  </g>
  <g class="architecture-node" data-component="protection" role="button" tabindex="0" aria-label="Explain old-task protection and the frozen reference">
    <rect class="architecture-box architecture-frozen" x="24" y="844" width="282" height="105" rx="6"/>
    <text x="165" y="874" text-anchor="middle">Frozen pre-request snapshot</text><text x="165" y="902" text-anchor="middle" class="architecture-small">Reference weights for protected tasks</text><text x="165" y="930" text-anchor="middle" class="architecture-status">REFERENCE DOES NOT CHANGE</text>
    <path class="architecture-flow" d="M306 896 H355"/>
    <rect class="architecture-box" x="360" y="844" width="572" height="105" rx="6"/>
    <text x="646" y="874" text-anchor="middle" class="architecture-label">Protection: keep earlier generated weights close</text>
    <text x="646" y="903" text-anchor="middle" class="architecture-small architecture-learning">Eight earlier tasks, including task 3 in its current state</text>
    <text x="646" y="903" text-anchor="middle" class="architecture-small architecture-unlearning">Seven retained tasks; task 3 is excluded</text>
    <text x="646" y="930" text-anchor="middle" class="architecture-small">Current weights can move; the penalty discourages change.</text>
  </g>
  <path class="architecture-flow" d="M480 801 V820 H946 V966 H580 V975"/><path class="architecture-flow" d="M646 949 V975"/>
  <rect class="architecture-box" x="228" y="980" width="704" height="74" rx="6"/>
  <text x="580" y="1008" text-anchor="middle" class="architecture-label architecture-learning">Total loss = classification error + 0.1 × protection</text>
  <text x="580" y="1008" text-anchor="middle" class="architecture-label architecture-unlearning">Total loss = 0.01 × noise distance + protection</text>
  <text x="580" y="1037" text-anchor="middle" class="architecture-small architecture-learning">Adam updates the shared generator and new task code.</text>
  <text x="580" y="1037" text-anchor="middle" class="architecture-small architecture-unlearning">Adam updates the shared generator only. Task codes stay frozen.</text>
</svg>
